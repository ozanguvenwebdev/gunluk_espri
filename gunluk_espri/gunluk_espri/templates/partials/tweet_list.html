{% for tweet in tweets %}

    {% if forloop.last and tweets.has_next %}
    <a href="#" hx-get="{% url "timeline" %}?page={{ tweets.number|add:1 }}" hx-trigger="revealed" hx-swap="afterend" hx-target="this">
    {% else %}
    <a href="#">
    {% endif %}
    
        <div class="widget heading_space text-md-start" style="padding: 15px 18px;margin-bottom: 10px;">
            <h4 class="darkcolor" style="margin-top:5px;">{{tweet.id}} {{tweet.profile.user.username}}</h4>
            <p style="margin:0;">{{tweet.content}}</p>
        </div>
    </a>
{% endfor %}
